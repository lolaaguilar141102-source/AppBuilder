<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform App Builder — Exam Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F6;
    --surface:#FFFFFF;
    --surface-2:#E3E8F0;
    --ink:#182238;
    --ink-soft:#4C5670;
    --muted:#7A84A0;
    --line:#D5DCE8;
    --accent:#28527A;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCE7F2;
    --good:#2F7D5B;
    --good-soft:#E1F1E8;
    --bad:#B5482E;
    --bad-soft:#FBE7E1;
    --mark:#B4791C;
    --mark-soft:#FBEDD6;
    --shadow: 0 1px 2px rgba(24,34,56,.06), 0 8px 24px rgba(24,34,56,.08);
    --radius: 10px;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#10131C;
      --surface:#171B27;
      --surface-2:#1F2432;
      --ink:#E9EDF6;
      --ink-soft:#B7C0D6;
      --muted:#7E88A3;
      --line:#2A3040;
      --accent:#6FA8D8;
      --accent-ink:#0B1220;
      --accent-soft:#1E2E3E;
      --good:#5FBE8F;
      --good-soft:#183226;
      --bad:#E28066;
      --bad-soft:#3A1E18;
      --mark:#E3B15B;
      --mark-soft:#3A2E15;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10131C;
    --surface:#171B27;
    --surface-2:#1F2432;
    --ink:#E9EDF6;
    --ink-soft:#B7C0D6;
    --muted:#7E88A3;
    --line:#2A3040;
    --accent:#6FA8D8;
    --accent-ink:#0B1220;
    --accent-soft:#1E2E3E;
    --good:#5FBE8F;
    --good-soft:#183226;
    --bad:#E28066;
    --bad-soft:#3A1E18;
    --mark:#E3B15B;
    --mark-soft:#3A2E15;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:var(--accent);}
  button{font-family:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}

  /* ---------- Top chrome ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(140%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1100px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{font-family:var(--serif);font-weight:600;font-size:1.15rem;letter-spacing:.2px;}
  .brand .sub{color:var(--muted);font-size:.78rem;}
  .icon-btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
    width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:16px;transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn:active{transform:scale(.94);}

  /* ---------- Landing ---------- */
  .hero{padding:56px 0 8px;}
  .constellation{width:100%;max-width:520px;height:120px;display:block;margin:0 auto 18px;opacity:.9;}
  .constellation circle{fill:var(--accent);}
  .constellation line{stroke:var(--line);stroke-width:1;}
  .hero h1{
    font-family:var(--serif);font-weight:600;font-size:clamp(2rem,5vw,2.9rem);
    text-align:center;margin:0 0 8px;letter-spacing:-.01em;
  }
  .hero p.lede{
    text-align:center;color:var(--ink-soft);max-width:560px;margin:0 auto 40px;
    font-size:1.02rem;
  }

  .mode-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;
  }
  @media (max-width:820px){ .mode-grid{grid-template-columns:1fr;} }

  .mode-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;cursor:pointer;text-align:left;box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .12s ease;
    display:flex;flex-direction:column;gap:10px;
  }
  .mode-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .mode-card.disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .mode-card.disabled:hover{border-color:var(--line);transform:none;}
  .mode-card .tag{
    font-size:.7rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  }
  .mode-card h3{margin:0;font-family:var(--serif);font-weight:600;font-size:1.25rem;}
  .mode-card p{margin:0;color:var(--ink-soft);font-size:.9rem;}
  .mode-card .count{margin-top:auto;font-size:.8rem;color:var(--muted);font-family:var(--mono);}

  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;box-shadow:var(--shadow);margin-bottom:24px;
  }
  .panel h4{margin:0 0 14px;font-size:.95rem;font-weight:600;}
  .row{display:flex;flex-wrap:wrap;gap:22px;align-items:center;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:.78rem;color:var(--muted);}
  select, input[type=number]{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    padding:8px 10px;border-radius:7px;font-size:.9rem;font-family:inherit;
  }
  .toggle{
    display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
    padding:7px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface-2);
    font-size:.85rem;color:var(--ink-soft);transition:all .12s ease;
  }
  .toggle input{accent-color:var(--accent);width:15px;height:15px;}
  .toggle.on{border-color:var(--accent);color:var(--ink);background:var(--accent-soft);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    border:none;border-radius:8px;padding:11px 20px;font-size:.92rem;font-weight:600;
    cursor:pointer;transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:var(--bad-soft);color:var(--bad);}

  .marked-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{
    font-family:var(--mono);font-size:.76rem;background:var(--mark-soft);color:var(--mark);
    border-radius:6px;padding:4px 8px;
  }

  /* ---------- Quiz layout ---------- */
  .quiz-shell{display:grid;grid-template-columns:220px 1fr;gap:22px;padding:22px 0 60px;align-items:start;}
  @media (max-width:900px){ .quiz-shell{grid-template-columns:1fr;} }

  .nav-panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto;
  }
  @media (max-width:900px){ .nav-panel{position:static;max-height:none;} }
  .nav-panel h5{margin:0 0 10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
  .nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  @media (max-width:900px){ .nav-grid{grid-template-columns:repeat(10,1fr);} }
  @media (max-width:520px){ .nav-grid{grid-template-columns:repeat(7,1fr);} }
  .nav-dot{
    aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--ink-soft);
    cursor:pointer;font-family:var(--mono);position:relative;
  }
  .nav-dot.answered{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .nav-dot.current{outline:2px solid var(--accent);outline-offset:1px;}
  .nav-dot.marked::after{
    content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;
    background:var(--mark);border:1px solid var(--surface);
  }
  .nav-dot.correct{background:var(--good-soft);color:var(--good);border-color:var(--good);}
  .nav-dot.incorrect{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:.75rem;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .quiz-main{min-width:0;}
  .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .progress-wrap{flex:1;min-width:160px;}
  .progress-track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease;}
  .progress-label{font-size:.76rem;color:var(--muted);margin-top:6px;}
  .timer{
    font-family:var(--mono);font-size:.95rem;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;color:var(--ink-soft);white-space:nowrap;
  }
  .timer.low{color:var(--bad);border-color:var(--bad);}

  .qcard{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 28px;box-shadow:var(--shadow);
  }
  .qcard .qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .qnum{font-family:var(--mono);color:var(--muted);font-size:.8rem;}
  .change-badge{display:inline-block;font-size:.7rem;font-weight:600;line-height:1.4;letter-spacing:.01em;color:var(--mark);background:var(--mark-soft);border-radius:5px;padding:3px 7px;white-space:nowrap;}
  .mark-btn{
    display:inline-flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);
    color:var(--ink-soft);padding:6px 11px;border-radius:99px;font-size:.78rem;cursor:pointer;
  }
  .mark-btn.on{background:var(--mark-soft);color:var(--mark);border-color:var(--mark);}
  .qtext{font-size:1.05rem;line-height:1.6;white-space:pre-wrap;margin-bottom:20px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;text-align:left;
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
    padding:13px 15px;cursor:pointer;transition:border-color .12s ease, background .12s ease;
  }
  .opt:hover{border-color:var(--accent);}
  .opt .letter{
    font-family:var(--mono);font-weight:600;color:var(--muted);width:20px;flex-shrink:0;
  }
  .opt.selected{border-color:var(--accent);background:var(--accent-soft);}
  .opt.selected .letter{color:var(--accent);}
  .opt.correct{border-color:var(--good);background:var(--good-soft);}
  .opt.correct .letter{color:var(--good);}
  .opt.incorrect{border-color:var(--bad);background:var(--bad-soft);}
  .opt.incorrect .letter{color:var(--bad);}
  .opt.locked{cursor:default;}

  .feedback{
    margin-top:16px;padding:12px 14px;border-radius:8px;font-size:.88rem;display:none;
  }
  .feedback.show{display:block;}
  .feedback.good{background:var(--good-soft);color:var(--good);}
  .feedback.bad{background:var(--bad-soft);color:var(--bad);}

  .qfooter{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:10px;flex-wrap:wrap;}
  .qfooter .left, .qfooter .right{display:flex;gap:10px;}

  /* ---------- Results ---------- */
  .score-hero{text-align:center;padding:34px 0 10px;}
  .score-big{font-family:var(--serif);font-size:3.4rem;font-weight:600;}
  .score-sub{color:var(--muted);font-size:.9rem;margin-top:6px;}
  .result-list{display:flex;flex-direction:column;gap:10px;}
  .result-row{
    background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 16px;
    display:flex;gap:14px;align-items:flex-start;cursor:pointer;
  }
  .result-row:hover{border-color:var(--accent);}
  .result-badge{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:.72rem;font-weight:700;flex-shrink:0;margin-top:2px;
  }
  .result-badge.correct{background:var(--good-soft);color:var(--good);}
  .result-badge.incorrect{background:var(--bad-soft);color:var(--bad);}
  .result-badge.marked{background:var(--mark-soft);color:var(--mark);}
  .result-row .rtext{font-size:.86rem;color:var(--ink-soft);}
  .result-row .rq{font-size:.92rem;color:var(--ink);margin-bottom:3px;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--muted);
  }
  .empty-state .big{font-size:2rem;margin-bottom:10px;}

  .hide{display:none !important;}
  footer.foot{text-align:center;color:var(--muted);font-size:.78rem;padding:30px 0 50px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark">Platform App Builder</span>
      <span class="sub">Summer '26 Simulator</span>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="homeBtn" title="Start screen" style="display:none;">⌂</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
    </div>
  </div>
</div>

<div class="wrap" id="app"></div>

<footer class="foot">158 core + 26 additional practice items · local &amp; private — your progress is stored only in this browser.</footer>

<script>
/* =========================================================
   QUESTION BANK
========================================================= */
const BANK = [
{text:`A services manager wants to make sure the team enters case priority consistently.\nWhich feature should a Platform App Builder use to accomplish this?`,options:[`In App Guidance`,`Path`,`Flow`,`Next Best Action`],correct:1},
{text:`Universal Containers needs to stamp the Stage_Last_Changed__c date field on the opportunity record whenever the StageName changes.\nHow should the Platform App Builder implement this request?`,options:[`A before-save record-triggered flow on Opportunity that assigns today's date to Stage_Last_Changed__c when StageName is changed`,`A scheduled path on an after-save record-triggered flow that updates Stage_Last_Changed__c to today's date 1 hour after the change`,`An approval process on Opportunity that uses Update Records to set Stage_Last_Changed__c to today's date when StageName is changed`,`An autolaunched flow invoked from a custom button that the user clicks after editing the StageName to update Stage_Last_Changed__c`],correct:0},
{text:`The DreamHouse Realty service manager asks for some improvements in case management. They want to enforce compliance so that cases are unable to be reverted to an earlier case status, and to ensure that certain fields are required when specific case criteria are met.\nWhich solution should a Platform App Builder implement to meet these requirements?`,options:[`Validation rules`,`Approval process`,`Case flow`,`Dependent picklist`],correct:0},
{text:`Universal Containers has two custom objects, Inspection__c and Building__c, that are not yet related. The maintenance team expects to log roughly three inspections for each building every year. The business has two requirements: When a building record is deleted, all of its related inspection records must be deleted as well automatically. Each inspection record must follow the same sharing and access settings as its building.\nHow should the Platform App Builder create the relationship?`,options:[`Create a required lookup relationship field on Building__c that relates it to Inspection__c`,`Create a master-detail relationship field on Building__c that relates it to Inspection__c`,`Create a required lookup relationship field on Inspection__c that relates it to Building__c`,`Create a master-detail relationship field on Inspection__c that relates it to Building__c`],correct:3},
{text:`Cloud Kicks conducts an evaluation of sales reps with a custom object that houses a scorecard. The company wants to ensure that only the sales reps, their managers, and their manager's executives can view the rep's scorecard, but also prevent the reps from being able to view the executive comment fields on their review.\nHow should the Platform App Builder meet these requirements?`,options:[`Use a Private sharing model granting record access using hierarchy; manage field access with record types and field-level security`,`Use a Private sharing model granting record access using custom settings; manage field access with page layouts and field-level security`,`Use a Private sharing model granting record access using hierarchy; manage field access with field-level security`,`Use a Private sharing model granting record access using custom settings; manage field access with record types and page layouts`],correct:2},
{text:`A sales team receives a list of approximately 800 leads each morning from the marketing team. The marketing team does not know if any of the leads are currently in the pipeline and sends the entire list each morning.\nWhich tool should a Platform App Builder use to import these leads into Salesforce while preventing the duplicates from being inserted?`,options:[`Data Import Wizard`,`Data Loader`,`Dataloader.io`,`Manual entry`],correct:0},
{text:`A company needs to evaluate all open cases related to an Account when that Account's status changes to "Critical". The flow must loop through the retrieved cases, change their priority to "High", and then update all modified records in a single database operation.\nWhich combination of Flow elements must the company use inside the loop to store the changes before updating the database?`,options:[`A Decision element and an Update Records element`,`An Assignment element and a Collection Filter element`,`An Assignment element and a collection variable`,`A Loop element and a Get Records element`],correct:2},
{text:`Cloud Kicks has three types of customer support processes: Platinum, Diamond, and Bronze. The Platform App Builder created separate record types for each process on the Case object. The customer support team should be unable to create new cases with the Bronze record type.\nHow should the app builder meet this requirement?`,options:[`Create a permission set group for Case that includes Platinum and Diamond record types`,`Update the organization-wide defaults to Private for Case`,`Update the support team profile to remove the Bronze record type`,`Make the record type hidden to support users; update sharing rules to Private`],correct:2},
{text:`Ursa Major Solar wants to create a relationship between the standard Contact object and a custom Solar Project object. Contacts can potentially be related to multiple Solar Project objects, and a Solar Project can have multiple Contacts associated with it.\nHow should the Platform App Builder configure the data model?`,options:[`One master-detail relationship on Contact and one master-detail relationship on Solar Project`,`Two lookup relationships on a new custom object`,`One lookup relationship on Contact and one lookup relationship on Solar Project`,`Two master-detail relationships on a new custom object`],correct:3},
{text:`A Platform App Builder notices several accounts converted from leads are missing information they expected to be caught via Account validation rules.\nWhat is the source of this issue?`,options:[`Account validation rules fail to validate on records converted from a lead`,`The lead settings are allowing users to intentionally bypass validation rules`,`The lead settings are unchecked to require validation for converted leads`,`Lead validation rules fail to validate on records when they are being converted`],correct:2,changedFromOriginal:true},
{text:`Universal Containers uses a Private sharing model on Accounts. User A and user B both own Accounts of their own, and have been sent a link to look at a new account record owned by user C. User A is able to open and view the record, but user B receives an insufficient privileges error. User A and user B have the same role in the role hierarchy as user C.\nWhy does user A have access, but user B does not?`,options:[`User A and user B have different login access policies`,`User B has a scoping rule that restricts the account access`,`User A has View All Fields permission on the Account object`,`User A is in a public group that has access via a sharing rule`],correct:3},
{text:`The Platform App Builder at Ursa Major Solar created a master-detail relationship between a parent object Galaxy__c and child object Star__c.\nWhat is the effect of creating this type of relationship if users want to report on Galaxy__c with Star__c?`,options:[`A new custom report type will need to be created for Star__c with lookup fields from Galaxy__c`,`A Star__c report type with Galaxy__c as a field will be automatically created`,`A Galaxy__c with Star__c report type will be automatically created`,`A new custom report type will need to be created for Galaxy__c with Star__c`],correct:2},
{text:`A Platform App Builder at Northern Trail Outfitters created a sandbox template for Accounts, Projects, and Project Milestones to reconfigure some flows for the project management app.\nWhich type of testing environment should the app builder create?`,options:[`Developer Pro`,`Partial Copy`,`Scratch Org`,`Developer`],correct:1},
{text:`Northern Trail Outfitters has two custom objects that are part of a master-detail relationship.\nWhat determines the ownership and sharing access of the detail record?`,options:[`The default owner is set in the parent object's settings`,`The Owner field on the Master record`,`The owner is set independently on the detail object's settings`,`The Owner field on the Detail record`],correct:1},
{text:`Managers at Universal Containers want a quick way to create additional accounts to form a hierarchy from a parent Account record. They want to auto-populate five fields based on the parent to make it easier for users to create the child accounts quickly.\nWhat should the Platform App Builder recommend?`,options:[`Create a custom action`,`Add a custom link on Account`,`Customize a global quick action`,`Add Path on Account hierarchy`],correct:0},
{text:`Ursa Major Solar has received complaints about inconsistent customer service experiences and wants to provide its agents with a checklist of items that must be accomplished when servicing a case.\nWhat should a Platform App Builder use to implement this?`,options:[`Assistant component`,`Activity Timeline component`,`Actions & Recommendations component`,`Highlights Panel component`],correct:2},
{text:`Cloud Kicks has 5 years of sales data and would like to track when customers made their first purchase.\nHow should a Platform App Builder use a roll-up summary to meet the requirements?`,options:[`Create a new roll-up summary field called First Order Date, using Type MIN on the Opportunity Close Date with a filter where IsWon = TRUE`,`Create a new roll-up summary field called First Order Date, using Type SUM on Opportunity Close Date`,`Create a new date field called First Order Date, then set the date using a roll-up summary on Opportunity Close Date`,`Create a new date field called First Order Date, then create a roll-up summary to update the field using Type MIN`],correct:0},

const ALL_BANK = BANK.concat(ADDITIONAL_BANK);
const LS_MARK = 'apb_marked_v1';
const LS_THEME = 'apb_theme_v1';
const LS_SETTINGS = 'apb_quiz_settings_v1';

function loadMarks(){
  try{ return new Set(JSON.parse(localStorage.getItem(LS_MARK) || '[]')); }
  catch(e){ return new Set(); }
}
function saveMarks(){
  try{ localStorage.setItem(LS_MARK, JSON.stringify([...state.marks])); }catch(e){}
}
function loadTheme(){
  try{ return localStorage.getItem(LS_THEME) || ''; }catch(e){ return ''; }
}
function saveTheme(t){
  try{ localStorage.setItem(LS_THEME, t); }catch(e){}
}
function loadSettings(){
  try{ return JSON.parse(localStorage.getItem(LS_SETTINGS) || '{}'); }catch(e){ return {}; }
}
function saveSettings(){
  try{ localStorage.setItem(LS_SETTINGS, JSON.stringify({shuffleQ:state.shuffleQ, shuffleO:state.shuffleO})); }catch(e){}
}
const savedSettings = loadSettings();

const state = {
  marks: loadMarks(),
  screen: 'login',
  bankGroup: 'main',
  modeType: null,     // 'study' | 'exam' | 'review'
  order: [],          // array of bank indices in play order, each item: {bankIndex, options, correctIndex}
  current: 0,
  answers: {},         // position -> selected option index
  revealed: {},         // position -> bool (study mode reveal)
  shuffleQ: savedSettings.shuffleQ ?? true,
  shuffleO: savedSettings.shuffleO ?? true,
  examCount: 60,
  timer: { total:0, remaining:0, id:null },
};

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* =========================================================
   THEME
========================================================= */
function applyTheme(){
  const t = loadTheme();
  if(t) document.documentElement.setAttribute('data-theme', t);
}
applyTheme();
document.getElementById('themeBtn').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  let next;
  if(!cur) next = sysDark ? 'light' : 'dark';
  else next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  saveTheme(next);
});
document.getElementById('homeBtn').addEventListener('click', ()=>{
  if(state.timer.id) clearInterval(state.timer.id);
  state.screen = 'start';
  render();
});

/* =========================================================
   BUILD SESSION
========================================================= */
function buildSession(modeType, opts){
  let indices = state.bankGroup === 'additional' ? ADDITIONAL_BANK.map((_,i)=>BANK.length+i) : BANK.map((_,i)=>i);

  if(modeType === 'review'){
    indices = [...state.marks].filter(i => state.bankGroup === 'additional' ? i >= BANK.length : i < BANK.length);
    if(indices.length === 0) return false;
  } else {
    if(opts.shuffleQ) indices = shuffleArr(indices);
    if(modeType === 'exam'){
      indices = indices.slice(0, Math.min(opts.examCount, indices.length));
    }
  }

  const order = indices.map(bankIndex=>{
    const q = ALL_BANK[bankIndex];
    let opts_ = q.options.map((t,i)=>({t,orig:i}));
    if(opts.shuffleO) opts_ = shuffleArr(opts_);
    const correctIndex = opts_.findIndex(o=>o.orig === q.correct);
    return { bankIndex, options: opts_.map(o=>o.t), correctIndex };
  });

  state.modeType = modeType;
  state.order = order;
  state.current = 0;
  state.answers = {};
  state.revealed = {};

  if(modeType === 'exam'){
    const minutes = Math.round(order.length * 1.75);
    state.timer.total = minutes*60;
    state.timer.remaining = minutes*60;
  } else {
    state.timer.total = 0;
  }
  return true;
}

      </svg>
      <h1>Platform App Builder</h1>
      <p class="lede">158 scenario-based questions drawn from Ursa Major Solar, Cloud Kicks, Universal Containers and more — tuned for the Summer '26 exam guide.</p>
    </div>

    <div class="mode-grid">
      <button class="mode-card" data-mode="study">
        <span class="tag">Untimed</span>
        <h3>Study mode</h3>
        <p>Answer at your own pace. See the correct option and explanation cues right after you choose.</p>
        <span class="count">${BANK.length} questions available</span>
      </button>
      <button class="mode-card" data-mode="exam">
        <span class="tag">Timed</span>
        <h3>Exam mode</h3>
        <p>No feedback until you submit — just like the real thing. Choose how many questions to include.</p>
        <span class="count">~1.75 min / question</span>
      </button>
      <button class="mode-card ${markedCount? '' : 'disabled'}" data-mode="review" ${markedCount? '' : 'disabled'}>
        <span class="tag">For review</span>
        <h3>Marked questions</h3>
        <p>Revisit only the questions you flagged with the ★ marker while studying or testing.</p>
        <span class="count">${markedCount} marked right now</span>
      </button>
    </div>

    <div class="panel" id="additionalQuestions" style="border-color:var(--accent);">
      <span class="tag" style="color:var(--accent);font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;">Extra practice</span>
      <h3 style="font-family:var(--serif);font-size:1.35rem;margin:6px 0;">Additional Questions</h3>
      <p style="color:var(--ink-soft);margin:0 0 16px;">26 questions from the additional PDF. Practice these separately from the original 158 questions.</p>
      <div class="row" style="gap:10px;">
        <button class="btn btn-primary" id="additionalStudyBtn">Study additional questions</button>
        <button class="btn btn-ghost" id="additionalExamBtn">Exam: 26 questions</button>
      </div>
    </div>

    <div class="panel">
      <h4>Session settings</h4>
      <div class="row">
        <div class="toggle ${state.shuffleQ?'on':''}" id="toggleShuffleQ">
          <input type="checkbox" ${state.shuffleQ?'checked':''} tabindex="-1"> Shuffle question order
        </div>
        <div class="toggle ${state.shuffleO?'on':''}" id="toggleShuffleO">
          <input type="checkbox" ${state.shuffleO?'checked':''} tabindex="-1"> Shuffle answer choices (randomize A–D)
        </div>
        <div class="field" id="examCountField">
          <label>Exam length</label>
          <select id="examCountSelect">
            <option value="30" ${state.examCount==30?'selected':''}>30 questions (≈53 min)</option>
            <option value="60" ${state.examCount==60?'selected':''}>60 questions (≈105 min)</option>
            <option value="${BANK.length}" ${state.examCount==BANK.length?'selected':''}>All ${BANK.length} questions</option>
          </select>
        </div>
      </div>
      <p style="font-size:.8rem;color:var(--muted);margin:12px 0 0;">Enable ‘Shuffle answer choices’ to change the A–D order in every new attempt. The correct answer is adjusted automatically.</p>
      ${markedCount ? `<div class="marked-list">
        <button class="btn btn-ghost" id="clearMarksBtn" style="padding:6px 12px;font-size:.78rem;">Clear all marks (${markedCount})</button>
      </div>` : ''}
    </div>
  `;

  document.getElementById('toggleShuffleQ').addEventListener('click', ()=>{ state.shuffleQ = !state.shuffleQ; saveSettings(); renderStart(); });
  document.getElementById('toggleShuffleO').addEventListener('click', ()=>{ state.shuffleO = !state.shuffleO; saveSettings(); renderStart(); });
  document.getElementById('examCountSelect').addEventListener('change', e=>{ state.examCount = parseInt(e.target.value,10); });
  const clearBtn = document.getElementById('clearMarksBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    if(confirm('Remove all marked questions?')){ state.marks.clear(); saveMarks(); renderStart(); }
  });

  for(const [id,mode] of [['additionalStudyBtn','study'],['additionalExamBtn','exam']]){
    document.getElementById(id).addEventListener('click', ()=>{
      state.bankGroup='additional';
      const ok=buildSession(mode,{shuffleQ:state.shuffleQ,shuffleO:state.shuffleO,examCount:ADDITIONAL_BANK.length});
      if(!ok) return;
      state.screen='quiz'; render();
      if(mode==='exam') startTimer();
    });
  }
  app.querySelectorAll('.mode-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      state.bankGroup = 'main';
      const mode = card.dataset.mode;
      if(card.classList.contains('disabled')) return;
      const ok = buildSession(mode, {shuffleQ: state.shuffleQ, shuffleO: state.shuffleO, examCount: state.examCount});
      if(!ok) return;
      state.screen = 'quiz';
      render();
      if(mode === 'exam') startTimer();
    });
  });
}

/* =========================================================
   TIMER
========================================================= */
function startTimer(){
  if(state.timer.id) clearInterval(state.timer.id);
  state.timer.id = setInterval(()=>{
    state.timer.remaining--;
    updateTimerDisplay();
    if(state.timer.remaining <= 0){
      clearInterval(state.timer.id);
      submitExam();
    }
  }, 1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timerDisplay');
  if(!el) return;
  const m = Math.floor(state.timer.remaining/60);
  const s = state.timer.remaining%60;
  el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  el.classList.toggle('low', state.timer.remaining < 120);
}

/* =========================================================
   RENDER: QUIZ SCREEN
========================================================= */
function renderQuiz(){
  const total = state.order.length;
  const cur = state.current;
  const item = state.order[cur];
  const q = ALL_BANK[item.bankIndex];
  const isStudy = state.modeType === 'study' || state.modeType === 'review';
  const answered = state.answers[cur];
  const revealed = isStudy && state.revealed[cur];
  const answeredCount = Object.keys(state.answers).length;
  const isMarked = state.marks.has(item.bankIndex);

  const modeLabel = state.modeType === 'study' ? 'Study mode' : state.modeType === 'exam' ? 'Exam mode' : 'Marked review';

  let navDots = '';
  for(let i=0;i<total;i++){
    const it = state.order[i];
    let cls = 'nav-dot';
    if(i === cur) cls += ' current';
    if(state.answers.hasOwnProperty(i)) cls += ' answered';
    if(state.marks.has(it.bankIndex)) cls += ' marked';
    if(isStudy && state.revealed[i]){
      cls += state.answers[i] === it.correctIndex ? ' correct' : ' incorrect';
    }
    navDots += `<div class="${cls}" data-jump="${i}">${i+1}</div>`;
  }

  app.innerHTML = `
    <div class="quiz-shell">
      <div class="nav-panel">
        <h5>Question navigator</h5>
        <div class="nav-grid">${navDots}</div>
        <div class="legend">
          <span><i style="background:var(--accent)"></i> Answered</span>
          <span><i style="background:var(--mark)"></i> Marked</span>
          ${isStudy? `<span><i style="background:var(--good)"></i> Correct</span><span><i style="background:var(--bad)"></i> Incorrect</span>` : ''}
        </div>
        ${state.modeType==='exam' ? `<button class="btn btn-primary" id="submitExamBtn" style="width:100%;margin-top:16px;">Submit exam</button>` : `<button class="btn btn-ghost" id="finishStudyBtn" style="width:100%;margin-top:16px;">Finish &amp; review</button>`}
      </div>

      <div class="quiz-main">
        <div class="quiz-top">
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" style="width:${(answeredCount/total*100).toFixed(0)}%"></div></div>
            <div class="progress-label">${modeLabel} · ${answeredCount}/${total} answered</div>
          </div>
          ${state.modeType==='exam' ? `<div class="timer" id="timerDisplay">--:--</div>` : ''}
        </div>

        <div class="qcard">
          <div class="qmeta">
            <span class="qnum">Question ${cur+1} of ${total}</span>
            ${q.changedFromOriginal ? `<span class="change-badge" title="The correct answer was changed from the original simulator" aria-label="Answer changed">✦ Answer changed</span>` : ''}
            <button class="mark-btn ${isMarked?'on':''}" id="markBtn">${isMarked? '★ Marked':'☆ Mark for review'}</button>
          </div>
          <div class="qtext">${escapeHtml(q.text)}</div>
          <div class="options" id="optionsWrap">
            ${item.options.map((opt,i)=>{
              let cls='opt';
              if(answered===i) cls+=' selected';
              if(revealed){
                cls+=' locked';
                if(i===item.correctIndex) cls+=' correct';
                else if(i===answered) cls+=' incorrect';
              }
              return `<div class="${cls}" data-i="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span></div>`;
            }).join('')}
          </div>
          ${isStudy ? `<div class="feedback ${revealed? 'show':''} ${revealed && answered===item.correctIndex?'good':'bad'}" id="feedbackBox">
            ${revealed ? (answered===item.correctIndex ? '✓ Correct.' : `✗ Not quite. Correct answer: ${String.fromCharCode(65+item.correctIndex)}.`) : ''}
          </div>` : ''}
          <div class="qfooter">
            <div class="left">
              <button class="btn btn-ghost" id="prevBtn" ${cur===0?'disabled':''}>← Previous</button>
            </div>
            <div class="right">
              <button class="btn btn-primary" id="nextBtn" ${cur===total-1?'disabled':''}>Next →</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  if(state.modeType==='exam') updateTimerDisplay();

  // option click
  app.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(isStudy && state.revealed[cur]) return;
      const i = parseInt(el.dataset.i,10);
      state.answers[cur] = i;
      if(isStudy) state.revealed[cur] = true;
      renderQuiz();
    });
  });

  document.getElementById('markBtn').addEventListener('click', ()=>{
    if(state.marks.has(item.bankIndex)) state.marks.delete(item.bankIndex);
    else state.marks.add(item.bankIndex);
    saveMarks();
    renderQuiz();
  });

  document.getElementById('prevBtn').addEventListener('click', ()=>{ state.current--; renderQuiz(); });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ state.current++; renderQuiz(); });

  app.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.current = parseInt(el.dataset.jump,10); renderQuiz(); });
  });

  const submitBtn = document.getElementById('submitExamBtn');
  if(submitBtn) submitBtn.addEventListener('click', ()=>{
    if(confirm(`Submit exam? You've answered ${answeredCount} of ${total} questions.`)) submitExam();
  });
  const finishBtn = document.getElementById('finishStudyBtn');
  if(finishBtn) finishBtn.addEventListener('click', ()=>{
    state.screen = 'results';
    render();
  });
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* =========================================================
   SUBMIT / RESULTS
========================================================= */
function submitExam(){
  if(state.timer.id) clearInterval(state.timer.id);
  state.screen = 'results';
  render();
}

function renderResults(){
  const total = state.order.length;
  let correctCount = 0;
  const rows = state.order.map((item,i)=>{
    const ua = state.answers[i];
    const isCorrect = ua === item.correctIndex;
    if(isCorrect) correctCount++;
    return {i, item, ua, isCorrect};
  });
  const pct = total? Math.round(correctCount/total*100) : 0;

  app.innerHTML = `
    <div class="score-hero">
      <div class="score-big">${pct}%</div>
      <div class="score-sub">${correctCount} of ${total} correct · ${state.modeType} session</div>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" id="retakeIncorrectBtn">Retake incorrect only</button>
        <button class="btn btn-ghost" id="backStartBtn">Back to start</button>
      </div>
    </div>
    <div class="panel">
      <h4>Question review</h4>
      <div class="result-list">
        ${rows.map(r=>{
          const q = ALL_BANK[r.item.bankIndex];
          const marked = state.marks.has(r.item.bankIndex);
          return `<div class="result-row" data-jump="${r.i}">
            <div class="result-badge ${r.ua===undefined?'incorrect':(r.isCorrect?'correct':'incorrect')}">${r.ua===undefined?'–':(r.isCorrect?'✓':'✗')}</div>
            <div style="flex:1;">
              <div class="rq">${r.i+1}. ${escapeHtml(q.text.split('\\n')[0])}</div>
              ${q.changedFromOriginal ? `<span class="change-badge" title="The correct answer was changed from the original simulator">✦ Answer changed</span>` : ''}
              <div class="rtext">${r.ua===undefined? 'Not answered' : `Your answer: ${String.fromCharCode(65+r.ua)} · Correct: ${String.fromCharCode(65+r.item.correctIndex)}`}${marked? ' · ★ marked':''}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;

  document.getElementById('backStartBtn').addEventListener('click', ()=>{ state.screen='start'; render(); });
  document.getElementById('retakeIncorrectBtn').addEventListener('click', ()=>{
    const wrongIdx = rows.filter(r=>!r.isCorrect).map(r=>r.item.bankIndex);
    if(wrongIdx.length===0){ alert('Nothing to retake — perfect score!'); return; }
    const order = wrongIdx.map(bankIndex=>{
      const q = ALL_BANK[bankIndex];
      let opts_ = q.options.map((t,i)=>({t,orig:i}));
      if(state.shuffleO) opts_ = shuffleArr(opts_);
      const correctIndex = opts_.findIndex(o=>o.orig===q.correct);
      return { bankIndex, options: opts_.map(o=>o.t), correctIndex };
    });
    state.modeType = 'study';
    state.order = order;
    state.current = 0;
    state.answers = {};
    state.revealed = {};
    state.timer.total = 0;
    state.screen = 'quiz';
    render();
  });
  app.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.current = parseInt(el.dataset.jump,10);
      state.screen='quiz';
      render();
    });
  });
}

/* keyboard nav */
document.addEventListener('keydown', e=>{
  if(state.screen!=='quiz') return;
  if(e.key==='ArrowRight' && state.current < state.order.length-1){ state.current++; renderQuiz(); }
  if(e.key==='ArrowLeft' && state.current>0){ state.current--; renderQuiz(); }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=4){
    const item = state.order[state.current];
    if(n<=item.options.length){
      const isStudy = state.modeType==='study' || state.modeType==='review';
      if(isStudy && state.revealed[state.current]) return;
      state.answers[state.current] = n-1;
      if(isStudy) state.revealed[state.current] = true;
      renderQuiz();
    }
  }
});

render();
</script>
</body>
</html
